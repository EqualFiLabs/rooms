name: Validate
on:
  pull_request:
  push:
    branches: ['feat/**', 'fix/**']
permissions:
  contents: read
jobs:
  solidity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: foundry-rs/foundry-toolchain@v1
        with:
          version: nightly
      - run: forge fmt --check
      - run: forge build --sizes
      - run: forge test
        env:
          FOUNDRY_PROFILE: ci
