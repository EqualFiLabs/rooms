name: Validate
on:
  pull_request:
  push:
    branches: ['feat/**', 'fix/**']
permissions:
  contents: read
jobs:
  solidity:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: recursive
      - uses: foundry-rs/foundry-toolchain@v1
        with:
          version: nightly-bdd1162b2c24814d2424ffad4f8c587827f1a6ab
      - run: python3 tools/prepare_registry.py
      - run: forge fmt --check
      - run: forge build --sizes
      - run: forge test
        env:
          FOUNDRY_PROFILE: ci
      - run: forge lint src script --severity high -D warnings
      - run: python3 tools/build_manifest.py candidate-manifest.json
      - run: python3 -m unittest discover -s tools/tests -v
      - uses: actions/upload-artifact@v4
        with:
          name: candidate-manifest
          path: candidate-manifest.json
